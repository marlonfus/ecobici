services:
  db:
    image: postgis/postgis:16-3.4
    container_name: ecobici_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecobici
      POSTGRES_PASSWORD: ecobici_pass
      POSTGRES_DB: ecobici_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecobici_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecobici.com
      PGADMIN_DEFAULT_PASSWORD: admin_pass
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
